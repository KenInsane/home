<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1600" viewBox="0 0 2500 1600">
  <!-- Placeholder floor-plan "render". Replace with your own 16:10 CGI frame (render.jpg) and point campaign.json "render" at it. -->
  <defs>
    <pattern id="oak" width="420" height="56" patternUnits="userSpaceOnUse">
      <rect width="420" height="56" fill="#C39E74"/>
      <path d="M0 55.5H420M0 27.5H180M260 27.5H420" stroke="#AE885E" stroke-width="2"/>
      <path d="M140 0V28M330 28V56M60 28V56" stroke="#AE885E" stroke-width="2"/>
    </pattern>
    <pattern id="oak2" width="420" height="56" patternUnits="userSpaceOnUse">
      <rect width="420" height="56" fill="#CDAA80"/>
      <path d="M0 55.5H420M0 27.5H220M300 27.5H420M180 0V28M360 28V56" stroke="#B8946A" stroke-width="2"/>
    </pattern>
    <pattern id="tile" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="#DCD8D0"/><path d="M0 89.5H90M89.5 0V90" stroke="#C4BFB5" stroke-width="2"/>
    </pattern>
    <pattern id="tileb" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#CFD9DD"/><path d="M0 69.5H70M69.5 0V70" stroke="#B6C3C8" stroke-width="2"/>
    </pattern>
    <pattern id="deck" width="2500" height="30" patternUnits="userSpaceOnUse">
      <rect width="2500" height="30" fill="#8C7158"/><path d="M0 29H2500" stroke="#77604A" stroke-width="3"/>
    </pattern>
    <radialGradient id="sun" cx=".5" cy="0" r="1">
      <stop offset="0" stop-color="#FFEBC8" stop-opacity=".55"/><stop offset="1" stop-color="#FFEBC8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-10%" y="-10%" width="130%" height="130%"><feDropShadow dx="10" dy="14" stdDeviation="12" flood-color="#2A1E12" flood-opacity=".35"/></filter>
  </defs>

  <rect width="2500" height="1600" fill="#2B2D31"/>
  <!-- balcony -->
  <rect x="330" y="1450" width="780" height="120" fill="url(#deck)"/>
  <rect x="330" y="1556" width="780" height="14" fill="#4A4D52"/>

  <!-- floors -->
  <rect x="150" y="150" width="2200" height="1300" fill="#23201C"/>
  <rect x="180" y="180" width="1120" height="1240" fill="url(#oak)"/>
  <rect x="180" y="990" width="1120" height="430" fill="url(#tile)"/>
  <rect x="1330" y="180" width="370" height="1240" fill="url(#oak2)"/>
  <rect x="1730" y="180" width="590" height="720" fill="url(#oak)"/>
  <rect x="1730" y="930" width="590" height="490" fill="url(#tileb)"/>

  <!-- daylight -->
  <ellipse cx="740" cy="180" rx="620" ry="520" fill="url(#sun)"/>
  <ellipse cx="2020" cy="180" rx="380" ry="420" fill="url(#sun)"/>
  <ellipse cx="720" cy="1420" rx="460" ry="300" fill="url(#sun)" transform="rotate(180 720 1420)"/>

  <!-- interior walls -->
  <g fill="#23201C">
    <rect x="1300" y="150" width="30" height="560"/><rect x="1300" y="860" width="30" height="590"/>
    <rect x="1700" y="150" width="30" height="300"/><rect x="1700" y="600" width="30" height="850"/>
    <rect x="1730" y="900" width="590" height="30"/>
    <rect x="1700" y="1150" width="30" height="0"/>
    <rect x="180" y="975" width="260" height="15"/><rect x="1040" y="975" width="260" height="15"/>
  </g>
  <!-- door gaps and swings -->
  <g fill="none" stroke="#5A544C" stroke-width="3">
    <path d="M1700 450 A150 150 0 0 1 1850 600"/><path d="M1330 710 A150 150 0 0 1 1480 860"/>
    <path d="M1730 1100 A140 140 0 0 0 1870 960"/>
  </g>
  <rect x="1700" y="1100" width="30" height="150" fill="#C9B79C"/>
  <!-- windows -->
  <g fill="#9FC3D6">
    <rect x="380" y="150" width="720" height="30"/><rect x="1860" y="150" width="320" height="30"/>
    <rect x="2320" y="1020" width="30" height="200"/><rect x="420" y="1420" width="600" height="30"/>
  </g>

  <g filter="url(#sh)">
    <!-- living -->
    <rect x="450" y="200" width="420" height="50" rx="6" fill="#3A332D"/>
    <rect x="500" y="208" width="320" height="16" rx="3" fill="#16181B"/>
    <rect x="330" y="340" width="600" height="380" rx="10" fill="#9A5E45"/>
    <rect x="360" y="370" width="540" height="320" rx="6" fill="none" stroke="#B87A5C" stroke-width="6"/>
    <rect x="520" y="440" width="230" height="130" rx="12" fill="#E3D5C0"/>
    <circle cx="590" cy="490" r="18" fill="#3F6B4A"/><rect x="650" y="470" width="70" height="44" rx="4" fill="#4C4640"/>
    <rect x="280" y="760" width="700" height="150" rx="22" fill="#56606E"/>
    <rect x="300" y="770" width="210" height="100" rx="16" fill="#66717F"/><rect x="525" y="770" width="210" height="100" rx="16" fill="#66717F"/><rect x="750" y="770" width="210" height="100" rx="16" fill="#66717F"/>
    <rect x="1020" y="400" width="170" height="170" rx="26" fill="#C8873F"/><rect x="1040" y="420" width="130" height="110" rx="18" fill="#D99A52"/>
    <circle cx="1210" cy="250" r="48" fill="#3F6B4A"/><circle cx="1195" cy="232" r="26" fill="#4E8259"/>
    <circle cx="250" cy="270" r="42" fill="#3F6B4A"/><circle cx="262" cy="258" r="22" fill="#5A8F64"/>
    <circle cx="1100" cy="820" r="30" fill="#EADBB8"/>
    <!-- kitchen -->
    <rect x="200" y="1330" width="760" height="80" rx="4" fill="#E8E5DF"/><rect x="200" y="1050" width="80" height="360" rx="4" fill="#E8E5DF"/>
    <rect x="420" y="1345" width="120" height="52" rx="10" fill="#A9B1B8"/><g fill="#2E3237"><circle cx="680" cy="1370" r="18"/><circle cx="740" cy="1370" r="18"/><circle cx="800" cy="1370" r="18"/></g>
    <g fill="#3B3F46"><rect x="610" y="1010" width="70" height="56" rx="10"/><rect x="740" y="1010" width="70" height="56" rx="10"/><rect x="870" y="1010" width="70" height="56" rx="10"/>
      <rect x="610" y="1244" width="70" height="56" rx="10"/><rect x="740" y="1244" width="70" height="56" rx="10"/><rect x="870" y="1244" width="70" height="56" rx="10"/></g>
    <rect x="580" y="1060" width="390" height="180" rx="10" fill="#B58C62"/>
    <circle cx="775" cy="1150" r="30" fill="#E8E1D3"/><circle cx="775" cy="1150" r="12" fill="#C2483A"/>
    <!-- hallway -->
    <rect x="1420" y="300" width="190" height="860" rx="6" fill="#6B7480"/>
    <rect x="1440" y="320" width="150" height="820" rx="4" fill="none" stroke="#7F8894" stroke-width="5"/>
    <rect x="1345" y="1220" width="60" height="180" rx="4" fill="#A88A68"/>
    <rect x="1620" y="1250" width="60" height="150" rx="4" fill="#3A332D"/>
    <!-- bedroom -->
    <rect x="1800" y="230" width="330" height="400" rx="14" fill="#ECE6DA"/>
    <rect x="1825" y="250" width="130" height="80" rx="18" fill="#F7F4EE"/><rect x="1975" y="250" width="130" height="80" rx="18" fill="#F7F4EE"/>
    <rect x="1800" y="420" width="330" height="210" rx="12" fill="#7E8C9A"/><rect x="1800" y="420" width="330" height="30" fill="#8E9CAA"/>
    <rect x="1745" y="240" width="45" height="60" rx="4" fill="#A88A68"/><rect x="2140" y="240" width="45" height="60" rx="4" fill="#A88A68"/>
    <rect x="2220" y="300" width="85" height="340" rx="4" fill="#3A332D"/>
    <rect x="2232" y="360" width="20" height="220" rx="3" fill="#121417"/><rect x="2253" y="380" width="6" height="180" fill="#4DA3FF" opacity=".6"/>
    <circle cx="2180" cy="470" r="34" fill="#2A2D33"/>
    <rect x="1760" y="820" width="540" height="64" rx="4" fill="#A88A68"/><path d="M1940 820V884M2120 820V884" stroke="#8F7254" stroke-width="4"/>
    <rect x="1840" y="660" width="260" height="120" rx="10" fill="#C7A07A"/>
    <!-- bathroom -->
    <rect x="2060" y="950" width="245" height="180" rx="30" fill="#F4F6F7"/><rect x="2080" y="970" width="205" height="140" rx="24" fill="#D7E6EE"/>
    <rect x="1750" y="950" width="170" height="70" rx="10" fill="#F4F6F7"/><ellipse cx="1835" cy="985" rx="50" ry="22" fill="#D7E6EE"/>
    <rect x="1760" y="1300" width="80" height="100" rx="30" fill="#F4F6F7"/>
    <rect x="2140" y="1250" width="160" height="150" rx="6" fill="#B9C6CC"/><path d="M2140 1250L2300 1400M2300 1250L2140 1400" stroke="#A6B4BA" stroke-width="3"/>
  </g>
</svg>
